name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Gise.slnx

      - name: Build
        run: dotnet build Gise.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Gise.UnitTests/Gise.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL in Testcontainers)
        run: dotnet test tests/Gise.IntegrationTests/Gise.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/Gise.Infrastructure --startup-project src/Gise.Api --no-build --configuration Release

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Put an event on sale, buy, pay at the provider, refund
        run: bash tests/smoke/buy.sh

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
