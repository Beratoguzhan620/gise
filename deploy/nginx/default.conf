# Serves the web app and forwards the API and the test payment provider. One origin, so the browser needs no CORS.
upstream api {
    server api:8080;
}

upstream payments {
    server payments:8080;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location ~ ^/(api|scalar|openapi|health)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The stand-in payment provider's hosted page. A real provider lives on its own domain.
    location /sandbox/ {
        proxy_pass http://payments/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be fresh, or a gate device could keep an old app.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else is the single-page app. Text from the API is rendered as text; the policy is a second line of
    # defence: scripts and connections only from this origin, no framing. The camera is allowed for the gate scanner.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
